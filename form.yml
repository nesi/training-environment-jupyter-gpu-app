---
cluster: "my-k8s-cluster"

form:
  - cpu
  - memory
  - gpu_model
  - gpu_vram
  - gpu_count
  - wall_time

attributes:
  # GPU work is CPU work here, and the emulated utilisation figure is derived
  # from how much of the CPU allocation a job actually uses. Too few cores and
  # every job looks busy at trivial load; these defaults give PyTorch enough to
  # work with and make the utilisation reading mean something.
  cpu: 4
  memory: 8

  gpu_model:
    widget: select
    label: "Emulated GPU"
    help: |
      Which card the session pretends to have. This changes the model name,
      memory size, clocks and power envelope reported by nvidia-smi and nvtop.
      **No physical GPU is involved either way** - all computation runs on the CPU.
    options:
      - ["NVIDIA L4 (24 GB)", "l4"]
      - ["NVIDIA A100 (40 GB)", "a100"]
      - ["NVIDIA H100 (80 GB)", "h100"]
      - ["NVIDIA RTX PRO 6000 Blackwell (96 GB)", "rtxpro6000"]
    value: "l4"

  gpu_vram:
    widget: select
    label: "GPU memory"
    help: |
      How much device memory the emulated card reports.

      The default of 1&nbsp;GB is deliberate. A small card is the practical way
      to teach memory pressure: a learner hits a genuine out-of-memory error
      with a tensor that costs the session almost nothing, so batch-sizing and
      OOM-recovery exercises work without the session needing tens of gigabytes
      of real RAM to fill.

      **Card default** reports the real board's figure instead (24 GB for an
      L4, 96 GB for an RTX PRO 6000). Choose it when the workshop does not
      cover memory, or when the reported size itself is the point.
    options:
      - ["1 GiB (default)", "1GiB"]
      - ["512 MiB", "512MiB"]
      - ["2 GiB", "2GiB"]
      - ["4 GiB", "4GiB"]
      - ["8 GiB", "8GiB"]
      - ["Card default (full size)", ""]
    value: "1GiB"

  gpu_count:
    widget: select
    label: "Number of GPUs"
    help: |
      How many emulated devices to present. Use more than one to teach device
      selection and `CUDA_VISIBLE_DEVICES`; the scheduler will allocate them to
      jobs independently.
    options:
      - ["1", "1"]
      - ["2", "2"]
      - ["4", "4"]
    value: "1"

  wall_time:
    widget: number_field
    label: "Hours"
    min: 1
    max: 12
    value: 8
