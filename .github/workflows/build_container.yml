#
name: Create and publish a Docker image

on:
  push:
  workflow_dispatch:

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:

  # The image tag inside submit.yml.erb is what a deployed session actually
  # runs. It is easy to miss on release, and the training-environment config's
  # `k8s_container` does NOT override it - that value only feeds the pod
  # pre-puller. A mismatch means the cluster silently runs an old image.
  check-submit-image-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: submit.yml.erb must pin this release's tag
        run: |
          tag="${GITHUB_REF_NAME}"
          pinned=$(grep -oE 'training-environment-jupyter-gpu-app:[^"]+' submit.yml.erb | cut -d: -f2)
          echo "git tag            : $tag"
          echo "submit.yml.erb pins: $pinned"
          if [ "$pinned" != "$tag" ]; then
            echo "::error file=submit.yml.erb::pins $pinned but this release is $tag."
            echo "  A session would run the wrong image. Update the image: line and re-tag."
            exit 1
          fi
          echo "ok: they match"


  # The staged template scripts must keep their executable bit. Open OnDemand
  # renders script.sh.erb into the job directory preserving its mode and then
  # runs it, so a file committed as 644 fails at session launch with
  # "Permission denied" - and nothing before that point notices.
  check-template-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: template/*.erb must be executable
        run: |
          fail=0
          for f in template/before.sh.erb template/script.sh.erb; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f is mode $mode, expected 100755."
              echo "  Fix with: git update-index --chmod=+x $f"
              fail=1
            else
              echo "ok: $f is $mode"
            fi
          done
          exit $fail

  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      # 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
